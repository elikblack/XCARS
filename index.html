<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XCARS // ALF-1129</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="callouts.css">
  <link rel="stylesheet" href="source-layout.css">
</head>
<body>
  <main class="msd" aria-label="XCARS master systems display">
    <div class="lcars-shell" aria-hidden="true">
      <div class="cap cap-left"></div>
      <div class="rail rail-top-left"></div>
      <div class="rail rail-top-right"></div>
      <div class="cap cap-right"></div>
      <div class="elbow elbow-left"></div>
      <div class="elbow elbow-center"></div>
      <div class="elbow elbow-right"></div>
      <div class="lower-rail lower-left"></div>
      <div class="lower-rail lower-center"></div>
      <div class="lower-rail lower-right"></div>
      <div class="accent accent-a"></div>
      <div class="accent accent-b"></div>
      <div class="accent accent-c"></div>
      <div class="accent accent-d"></div>
    </div>

    <header class="identity">
      <div class="plate"><span class="identity-text">ALF-1129</span></div>
      <div class="brand"><span class="identity-text">XCARS</span></div>
    </header>

    <section class="hero" aria-label="Xterra cutaway schematic">
      <img class="hero-image" src="assets/xterra-cutaway.png" alt="First-generation Nissan Xterra cutaway schematic">
      <button class="hotspot cargo" data-system="CARGO BAY" aria-label="Cargo bay"></button>
      <button class="hotspot cabin" data-system="OBSERVATION LOUNGE" aria-label="Cabin"></button>
      <button class="hotspot driveline" data-system="FUSION GENERATOR" aria-label="Driveline"></button>
      <button class="hotspot engine" data-system="FORWARD PHOTON EMITTER" aria-label="Engine"></button>
    </section>

    <img class="callout-leaders" src="assets/callout-leaders.svg" alt="" aria-hidden="true">

    <section class="callouts callouts-left" aria-label="Aft and support systems">
      <button data-system="CARGO BAY"><span>CARGO BAY</span><i></i></button>
      <button data-system="AFT SENSOR ARRAY"><span>AFT SENSOR ARRAY</span><i></i></button>
      <button data-system="GUEST QUARTERS"><span>GUEST QUARTERS</span><i></i></button>
      <button data-system="ESCAPE PODS"><span>ESCAPE PODS</span><i></i></button>
      <button data-system="SICKBAY"><span>SICKBAY</span><i></i></button>
      <button data-system="AFT NAVIGATIONAL DEFLECTOR"><span>AFT NAVIGATIONAL DEFLECTOR</span><i></i></button>
      <button data-system="SECONDARY INERTIAL DAMPER"><span>SECONDARY INERTIAL DAMPER</span><i></i></button>
    </section>

    <section class="callouts callouts-right" aria-label="Forward and primary systems">
      <button data-system="OBSERVATION LOUNGE"><i></i><span>OBSERVATION LOUNGE</span></button>
      <button data-system="PRIMARY SENSOR ARRAY"><i></i><span>PRIMARY SENSOR ARRAY</span></button>
      <button data-system="FORWARD SHIELD GRID"><i></i><span>FORWARD SHIELD GRID</span></button>
      <button data-system="PRECIPITATION COMPENSATOR"><i></i><span>PRECIPITATION COMPENSATOR</span></button>
      <button data-system="FUSION GENERATOR"><i></i><span>FUSION GENERATOR</span></button>
      <button data-system="BUSSARD HOODSCOOP"><i></i><span>BUSSARD HOODSCOOP</span></button>
      <button data-system="FORWARD PHOTON EMITTER"><i></i><span>FORWARD PHOTON EMITTER</span></button>
      <button data-system="NAVIGATIONAL DEFLECTOR"><i></i><span>NAVIGATIONAL DEFLECTOR</span></button>
      <button data-system="INERTIAL DAMPER"><i></i><span>INERTIAL DAMPER</span></button>
    </section>

    <section class="detail-strip" aria-live="polite">
      <span id="detail-kicker">SYSTEM SELECT</span>
      <strong id="detail-title">ALF-1129</strong>
      <span id="detail-copy">XCARS MASTER SYSTEMS DISPLAY // VEHICLE NOMINAL</span>
    </section>

    <section class="mini-panel" aria-label="Top view and subsystem activity">
      <div class="mini-tabs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="mini-view">
        <img src="assets/xterra-top.png" alt="Top-down Xterra schematic" onerror="this.hidden=true;this.parentElement.classList.add('missing')">
        <span class="missing-label">TOP VIEW // ASSET PENDING</span>
      </div>
      <div class="frequency" aria-hidden="true">
        <span>000hz</span><span>001hz</span><span>002hz</span><span>003hz</span><span>004hz</span>
      </div>
      <div class="activity" id="activity" aria-hidden="true"></div>
    </section>

    <footer class="footerline">
      <span>WD22</span>
      <span id="mode">MODE // NORMAL</span>
      <span>BUS <b id="voltage">13.8V</b></span>
      <span>RPM <b id="rpm">0825</b></span>
      <span id="clock">--:--</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
